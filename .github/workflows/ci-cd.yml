name: Continuous Integration/Deployment

on:
  push:

  # release on demand, so that a green build is not the same thing as a release
  workflow_dispatch:

env:
  CI: true

jobs:
  ci_cd:
    name: continuous integration/deployment

    # wait for a previous job to complete
    concurrency: ${{ github.workflow}}-${{ github.ref }}

    if: ${{ !contains(github.event.head_commit.message, '[skip-ci]') }}

    permissions:
      # push the version bump commit and the tag, create the github release
      contents: write
      # atomic-release comments on issues and pull requests mentioned in the changelog
      issues: write
      pull-requests: write
      # mint the OIDC token npm exchanges for a short lived publish token
      id-token: write

    runs-on: ubuntu-latest

    steps:
      # https://github.com/actions/checkout
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: true

      # https://github.com/actions/setup-node
      - name: setup node version
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      # https://github.com/actions/cache
      - name: cache node modules
        uses: actions/cache@v5
        id: npm-cache
        with:
          path: node_modules
          # include the branch name here..?
          key: node-modules-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: install node modules
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm install

      - name: lint
        run: npm run lint:all

      - name: compile
        run: npm run compile

      - name: test
        run: npm run test

      - name: fetch git tags
        run: git fetch --prune --unshallow --tags

      # Trusted publishing needs npm 11.5.1 or newer, which needs a modern node.
      # Only the release runs on it: lint, compile and test stay on the version
      # in .nvmrc, which is what this package is actually built against.
      - name: setup node version for publishing
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: release
        run: node scripts/release
        env:
          RELEASE_ACTOR: abstracter-bot <bot@abstracter.io>
          GITHUB_PAT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
